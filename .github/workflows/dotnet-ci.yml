name: .NET CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnitConversion.sln

      - name: Build solution
        run: dotnet build UnitConversion.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UnitConversion.sln --configuration Release --no-build --verbosity normal